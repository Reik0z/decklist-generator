<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  /* ── Variables ─────────────────────────────────────────────────────────────── */
  :root {
    --gold:       #C4982A;
    --gold-light: #E2BF60;
    --gold-dim:   #8A6A1A;
    --red:        #C01818;
    --red-glow:   rgba(180, 15, 15, 0.30);
    --text:       #FFFFFF;
    --text-dim:   #A0A0B0;
    --bar-bg:     rgba(255,255,255,0.07);
  }

  /* ── Reset ─────────────────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Canvas ────────────────────────────────────────────────────────────────── */
  body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 1000px 600px at 50% 30%, rgba(120,8,8,0.18) 0%, transparent 60%),
      linear-gradient(160deg, #0E0507 0%, #080306 55%, #040103 100%);
  }

  /* ── Page layout ───────────────────────────────────────────────────────────── */
  .page {
    width: 1920px; height: 1080px;
    display: grid;
    grid-template-rows: 110px 1fr 64px;
    padding: 0 52px;
    row-gap: 0;
  }

  /* ══ HEADER ════════════════════════════════════════════════════════════════ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(196,152,42,0.35);
    padding-bottom: 12px;
    margin-top: 20px;
  }

  /* Logo block */
  .logo-block { display: flex; flex-direction: column; gap: 2px; min-width: 240px; }
  .logo-diamond {
    width: 32px; height: 32px;
    background: var(--gold);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    margin-bottom: 6px;
  }
  .logo-title {
    font-size: 22px; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-light);
    line-height: 1;
  }
  .logo-sub {
    font-size: 11px; font-weight: 600;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold-dim);
  }

  /* Center title */
  .center-title { text-align: center; flex: 1; }
  .center-title h1 {
    font-size: 42px; font-weight: 900;
    letter-spacing: 6px; text-transform: uppercase;
    color: var(--gold-light);
    line-height: 1;
    text-shadow: 0 0 30px rgba(196,152,42,0.5);
  }
  .center-title h2 {
    font-size: 14px; font-weight: 600;
    letter-spacing: 5px; text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .center-title h3 {
    font-size: 17px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold);
    margin-top: 2px;
  }

  /* Right emblem */
  .emblem {
    min-width: 240px;
    display: flex; justify-content: flex-end; align-items: center;
  }
  .emblem-box {
    width: 80px; height: 80px;
    border: 2px solid var(--gold);
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    background: rgba(196,152,42,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: var(--gold);
    font-weight: 900;
  }

  /* ══ BODY ══════════════════════════════════════════════════════════════════ */
  .body { display: flex; flex-direction: column; justify-content: center; gap: 0; padding: 8px 0; }

  /* Column headers */
  .col-headers {
    display: flex;
    align-items: center;
    padding: 0 0 6px 0;
    border-bottom: 1px solid rgba(196,152,42,0.20);
    margin-bottom: 4px;
  }
  .ch-rank  { width: 72px; }
  .ch-art   { width: 220px; }
  .ch-name  { width: 280px; padding-left: 16px; }
  .ch-pct   { width: 90px; text-align: right; }
  .ch-bar   { flex: 1; padding: 0 24px; }
  .ch-count { width: 90px; text-align: right; }
  .col-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-dim);
  }

  /* Legend row */
  .legend-row {
    display: flex;
    align-items: center;
    height: var(--row-h, 100px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: relative;
  }

  /* Rank badge */
  .rank {
    width: 72px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .rank-badge {
    width: 44px; height: 44px;
    border: 2px solid var(--gold);
    background: rgba(196,152,42,0.10);
    transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(196,152,42,0.20);
  }
  .rank-badge span {
    transform: rotate(-45deg);
    font-size: 18px; font-weight: 900;
    color: var(--gold-light);
    line-height: 1;
  }

  /* Art */
  .art {
    width: 220px; height: calc(var(--row-h, 100px) - 10px);
    flex-shrink: 0;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(196,152,42,0.25);
    position: relative;
  }
  .art img {
    width: 100%; height: 200%;
    object-fit: cover;
    object-position: center 15%;
    display: block;
  }
  .art-placeholder {
    width: 100%; height: 100%;
    background: rgba(196,152,42,0.05);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-dim); font-size: 11px; letter-spacing: 2px;
  }
  /* Fade edges of art */
  .art::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to right, transparent 60%, rgba(4,1,3,0.85) 100%);
  }

  /* Name + domain */
  .legend-info {
    width: 280px; padding-left: 16px; flex-shrink: 0;
  }
  .legend-name {
    font-size: 22px; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text);
    line-height: 1.1;
  }
  .legend-domain {
    font-size: 11px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold);
    margin-top: 3px;
  }

  /* Percentage */
  .pct-text {
    width: 90px; text-align: right; flex-shrink: 0;
    font-size: 22px; font-weight: 700;
    color: var(--gold-light);
    font-variant-numeric: tabular-nums;
  }

  /* Bar */
  .bar-cell { flex: 1; padding: 0 24px; }
  .bar-track {
    height: 14px;
    background: var(--bar-bg);
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid rgba(196,152,42,0.12);
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim) 0%, var(--gold) 60%, var(--gold-light) 100%);
    border-radius: 7px;
    box-shadow: 0 0 10px rgba(196,152,42,0.40);
    transition: none;
  }

  /* Count */
  .count-text {
    width: 90px; text-align: right; flex-shrink: 0;
    font-size: 26px; font-weight: 900;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ══ FOOTER ════════════════════════════════════════════════════════════════ */
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(196,152,42,0.25);
    padding-top: 12px;
  }
  .footer-left { display: flex; align-items: center; gap: 12px; }
  .footer-icon {
    width: 28px; height: 28px;
    border: 1.5px solid var(--gold);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    background: rgba(196,152,42,0.12);
  }
  .footer-total {
    font-size: 12px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-dim);
  }
  .footer-date {
    font-size: 11px; font-weight: 500;
    letter-spacing: 2px;
    color: rgba(160,160,176,0.6);
  }

  /* ── Corner decorations ─────────────────────────────────────────────────── */
  .corner { position: fixed; pointer-events: none; }
  .corner-tl { top: 16px; left: 16px; }
  .corner-tr { top: 16px; right: 16px; }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--gold);
    opacity: 0.55;
  }
  .corner-tl::before { width: 28px; height: 2px; top: 0; left: 0; }
  .corner-tl::after  { width: 2px; height: 28px; top: 0; left: 0; }
  .corner-tr::before { width: 28px; height: 2px; top: 0; right: 0; }
  .corner-tr::after  { width: 2px; height: 28px; top: 0; right: 0; }
  .corner-gem {
    position: absolute;
    width: 8px; height: 8px;
    background: var(--gold);
    clip-path: polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  }
  .corner-tl .corner-gem { top: -3px; left: -3px; }
  .corner-tr .corner-gem { top: -3px; right: -3px; }
</style>
</head>
<body>
<div class="corner corner-tl"><div class="corner-gem"></div></div>
<div class="corner corner-tr"><div class="corner-gem"></div></div>

<div class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="logo-block">
      <div class="logo-diamond"></div>
      <div class="logo-title">Unleashed Open</div>
      <div class="logo-sub">Riftbound Chile</div>
    </div>

    <div class="center-title">
      <h1>Estadísticas</h1>
      <h2 id="hdr-subtitle">Unleashed Open</h2>
      <h3>Leyendas más jugadas</h3>
    </div>

    <div class="emblem">
      <div class="emblem-box">◆</div>
    </div>
  </header>

  <!-- BODY -->
  <main class="body" id="body">
    <!-- Populated by JS -->
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-left">
      <div class="footer-icon"></div>
      <span class="footer-total" id="footer-total"></span>
    </div>
    <span class="footer-date" id="footer-date"></span>
  </footer>

</div>

<script>
  /* __STATS_DATA__ */

  const { stats, total, date, eventName } = window.STATS_DATA;

  // Event name in header
  if (eventName) document.getElementById('hdr-subtitle').textContent = eventName;
  document.getElementById('footer-total').textContent =
    `Datos recolectados de ${total} mazo${total !== 1 ? 's' : ''} registrados`;
  document.getElementById('footer-date').textContent = `Actualizado: ${date}`;

  // Row height — fit rows in available space
  const MAX_ROWS   = 9;
  const BODY_H     = 1080 - 110 - 64 - 32; // header + footer + padding
  const COL_HDR_H  = 28;
  const visible    = stats.slice(0, MAX_ROWS);
  const rowH       = Math.floor((BODY_H - COL_HDR_H) / visible.length);

  document.documentElement.style.setProperty('--row-h', rowH + 'px');

  const maxCount = visible[0]?.count ?? 1;
  const body = document.getElementById('body');

  // Column headers
  const headers = document.createElement('div');
  headers.className = 'col-headers';
  headers.innerHTML = `
    <div class="ch-rank"></div>
    <div class="ch-art"></div>
    <div class="ch-name"></div>
    <div class="ch-pct col-label">% del meta</div>
    <div class="ch-bar"></div>
    <div class="ch-count col-label">Mazos</div>
  `;
  body.appendChild(headers);

  // Legend rows
  for (const entry of visible) {
    const barWidth = ((entry.count / maxCount) * 100).toFixed(1);
    const domainText = entry.domain.join(' & ');

    const artHtml = entry.img
      ? `<img src="${entry.img}" alt="${entry.name}" loading="eager">`
      : `<div class="art-placeholder">SIN IMAGEN</div>`;

    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `
      <div class="rank">
        <div class="rank-badge"><span>${entry.rank}</span></div>
      </div>
      <div class="art">${artHtml}</div>
      <div class="legend-info">
        <div class="legend-name">${entry.name}</div>
        ${domainText ? `<div class="legend-domain">${domainText}</div>` : ''}
      </div>
      <div class="pct-text">${entry.pct}%</div>
      <div class="bar-cell">
        <div class="bar-track">
          <div class="bar-fill" style="width:${barWidth}%"></div>
        </div>
      </div>
      <div class="count-text">${entry.count}</div>
    `;
    body.appendChild(row);
  }
</script>
</body>
</html>
